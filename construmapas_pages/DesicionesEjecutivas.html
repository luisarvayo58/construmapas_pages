                            { label: 'Cobrado', data: arr.map(x => +x.cobrado.toFixed(2)), backgroundColor: '#10b981', borderRadius: 6, barPercentage: .6 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 11 } } },
                            tooltip: { callbacks: { label: c => c.dataset.label + ': ' + fmtMXN0(c.parsed.y) } }
                        },
                        scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + (v / 1e6).toFixed(1) + 'M', font: { size: 10 } }, grid: { color: '#eef2f7' } }, x: { grid: { display: false }, ticks: { font: { size: 10.5 } } } }
                    }
                }
            }];
            return { html, charts };
        };

        /* ---------- 20. ESTADO DE CUENTA DE CLIENTE ---------- */
        VIEWS['estado-cuenta'] = () => {
            const clientes = D.clientesObra;
            if (!CLIENTE_SEL) CLIENTE_SEL = clientes[0].guid;
            const cli = MAPS.cliente[CLIENTE_SEL];
            const crs = CONTRARECIBOS.filter(c => c.clienteGuid === CLIENTE_SEL).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            const facturado = crs.reduce((s, c) => s + num(c.facturaRelacionadaImporte), 0);
            const cobrado = crs.reduce((s, c) => s + c.pagado, 0);
            const saldo = facturado - cobrado;

            const html = `
      <div class="space-y-5">
        <div class="card p-4 flex flex-wrap items-center gap-4">
          <div class="flex-1 min-w-[220px]">
            <label class="text-[10.5px] font-bold uppercase tracking-[.12em] text-ink-500">Cliente seleccionado</label>
            <select id="selCliente" class="mt-1.5 w-full text-[12.5px] font-semibold text-ink-800 bg-ink-50 border border-ink-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500/30">
              ${clientes.map(c => `<option value="${c.guid}" ${c.guid === CLIENTE_SEL ? 'selected' : ''}>${c.nombre} — ${c.razonSocial}</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 flex-[2]">
            <div><div class="text-[10px] font-bold uppercase text-ink-500">RFC</div><div class="text-[12px] font-semibold text-ink-800 num mt-0.5">${cli.rfc}</div></div>
            <div><div class="text-[10px] font-bold uppercase text-ink-500">Contacto</div><div class="text-[12px] font-semibold text-ink-800 mt-0.5">${cli.contacto}</div></div>
            <div><div class="text-[10px] font-bold uppercase text-ink-500">Teléfono</div><div class="text-[12px] font-semibold text-ink-800 num mt-0.5">${cli.telefono}</div></div>
            <div><div class="text-[10px] font-bold uppercase text-ink-500">Email</div><div class="text-[12px] font-semibold text-ink-800 mt-0.5 truncate">${cli.email}</div></div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Total facturado', value: fmtMXN0(facturado), sub: `${crs.length} contrarecibos emitidos`, icon: 'file-text', tone: 'info' })}
          ${kpiCard({ label: 'Total cobrado', value: fmtMXN0(cobrado), sub: fmtPct(facturado ? cobrado / facturado * 100 : 0) + ' de la facturación', icon: 'banknote', tone: 'good', progress: facturado ? cobrado / facturado * 100 : 0 })}
          ${kpiCard({ label: 'Saldo pendiente', value: fmtMXN0(saldo), sub: 'Por cobrar al cliente', icon: 'hourglass', tone: saldo > 0 ? 'warn' : 'good' })}
          ${kpiCard({ label: 'Días de crédito promedio', value: crs.filter(c => c.pagado > 0).length ? fmtNum(crs.filter(c => c.pagado > 0).reduce((s, c) => s + daysBetween(c.fecha, c.pagoItems[0].fecha), 0) / crs.filter(c => c.pagado > 0).length, 0) + ' días' : '—', sub: 'Entre emisión y cobro efectivo', icon: 'timer', tone: 'info' })}
        </div>

        ${tableCard('Contrarecibos emitidos al cliente',
                [{ t: '#', align: 'r' }, { t: 'Contrarecibo' }, { t: 'Emisión' }, { t: 'Vencimiento' }, { t: 'Factura', align: 'r' }, { t: 'Cobrado', align: 'r' }, { t: 'Saldo', align: 'r' }, { t: 'Estado' }],
                crs.map(cr => [
                    `<span class="text-ink-500">${cr.numeroSecuencia}</span>`,
                    `<span class="font-semibold text-ink-800">${cr.nombre}</span>`,
                    `<span class="text-[10.5px] text-ink-600">${fmtDate(cr.fecha)}</span>`,
                    `<span class="text-[10.5px] ${new Date(cr.fechaVencimiento) < TODAY && cr.saldo > 0 ? 'text-red-600 font-semibold' : 'text-ink-600'}">${fmtDate(cr.fechaVencimiento)}</span>`,
                    fmtMXN0(cr.facturaRelacionadaImporte), fmtMXN0(cr.pagado),
                    `<span class="${cr.saldo > 0 ? 'text-red-600 font-bold' : 'text-emerald-600'}">${fmtMXN0(cr.saldo)}</span>`,
                    cr.saldo <= 0.01 ? chip('Liquidado', 'good') : (new Date(cr.fechaVencimiento) < TODAY ? chip('Vencido', 'bad') : chip('Pendiente', 'warn'))
                ]), { maxH: 320 })}

        ${sectionTitle('Detalle de pagos recibidos')}
        ${tableCard('Pagos aplicados al cliente',
                    [{ t: 'Contrarecibo' }, { t: 'Fecha de pago' }, { t: 'Importe', align: 'r' }, { t: 'Aplicación', align: 'r' }],
                    (() => {
                        const rows = [];
                        crs.forEach(cr => (cr.pagoItems || []).forEach(p => {
                            rows.push([`<span class="font-semibold text-ink-800">${cr.nombre}</span>`,
                            `<span class="text-[10.5px] text-ink-600">${fmtDate(p.fecha)}</span>`,
                            fmtMXN0(p.importe),
                            `<span class="font-semibold text-emerald-600">${fmtPct(num(cr.facturaRelacionadaImporte) ? p.importe / num(cr.facturaRelacionadaImporte) * 100 : 0)}</span>`]);
                        }));
                        return rows;
                    })(), { maxH: 260 })}

        ${insightPanel([
                        { tone: saldo > 0 ? 'warn' : 'good', titulo: 'Situación de cobranza', detalle: saldo > 0 ? `${cli.nombre} mantiene un saldo pendiente de ${fmtMXN0(saldo)} correspondiente a ${crs.filter(c => c.saldo > 0).length} contrarecibo(s).` : `${cli.nombre} no presenta adeudos.` }
                    ])}
      </div>`;

            return {
                html, charts: [], after: () => {
                    const sel = document.getElementById('selCliente');
                    if (sel) sel.addEventListener('change', e => { CLIENTE_SEL = e.target.value; render(); });
                }
            };
        };

        /* ---------- 21. RETENCIONES Y FLUJO ---------- */
        VIEWS['retenciones'] = () => {
            const retencionesPorContrato = (D.contratos || []).map(c => {
                const ests = ESTIMACIONES.filter(e => e.contratoGuid === c.guid);
                const ret = ests.reduce((s, e) => s + e.ret, 0);
                const amort = ests.reduce((s, e) => s + e.amort, 0);
                const estimado = ests.reduce((s, e) => s + e.estimado, 0);
                const neto = ests.reduce((s, e) => s + e.neto, 0);
                return { c, contratista: MAPS.contratista[c.contratistaGuid] || { nombre: '—' }, ret, amort, estimado, neto, fondoGarantia: num(c.fondoGarantia) };
            }).sort((a, b) => b.ret - a.ret);

            const ingresosCobrados = CONTRARECIBOS.reduce((s, c) => s + c.pagado, 0);
            const egresosPagados = EST_PAGADAS.reduce((s, e) => s + e.neto, 0) + (D.ordenesCompra || []).reduce((s, oc) => {
                return s + (oc.pagos || []).reduce((t, p) => t + num(p.importe), 0);
            }, 0);
            const flujo = ingresosCobrados - egresosPagados;

            const totalRet = ESTIMACIONES.reduce((s, e) => s + e.ret, 0);
            const totalAmort = ESTIMACIONES.reduce((s, e) => s + e.amort, 0);

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Retenciones acumuladas', value: fmtMXN0(totalRet), sub: 'Fondo de garantía retenido en estimaciones', icon: 'shield-check', tone: 'info' })}
          ${kpiCard({ label: 'Amortización de anticipos', value: fmtMXN0(totalAmort), sub: 'Recuperado vía estimaciones', icon: 'percent', tone: 'good' })}
          ${kpiCard({ label: 'Ingresos cobrados', value: fmtMXN0(ingresosCobrados), sub: 'Pagos recibidos de clientes', icon: 'arrow-down-to-line', tone: 'good' })}
          ${kpiCard({ label: 'Flujo neto de caja', value: fmtMXN0(flujo), sub: 'Ingresos cobrados menos egresos pagados', icon: flujo >= 0 ? 'trending-up' : 'trending-down', tone: flujo >= 0 ? 'good' : 'bad' })}
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
          ${chartCard('chFlujo', 'Flujo de caja acumulado', 'Ingresos cobrados vs egresos pagados (MXN)', 320, 'xl:col-span-2')}
          ${chartCard('chRetDona', 'Composición de retenciones', 'Participación por contrato', 320)}
        </div>

        ${tableCard('Resumen de retenciones, fondo de garantía y flujo por contrato',
                [{ t: 'Contrato' }, { t: 'Contratista' }, { t: 'Estimado', align: 'r' }, { t: 'Retenciones', align: 'r' }, { t: 'Amort. anticipo', align: 'r' }, { t: 'Neto pagado', align: 'r' }, { t: 'Fondo garantía contractual', align: 'r' }, { t: '% Retenido', align: 'r' }],
                retencionesPorContrato.map(x => [
                    `<div class="font-semibold text-ink-800">${x.c.numeroContrato}</div>`,
                    `<span class="text-[10.5px] text-ink-600">${x.contratista.nombre}</span>`,
                    fmtMXN0(x.estimado), fmtMXN0(x.ret), fmtMXN0(x.amort), fmtMXN0(x.neto),
                    fmtMXN0(x.fondoGarantia),
                    `<span class="font-semibold text-ink-700">${fmtPct(x.estimado ? x.ret / x.estimado * 100 : 0)}</span>`
                ]), { maxH: 340 })}

        ${insightPanel([
                    { tone: flujo >= 0 ? 'good' : 'critical', titulo: 'Posición de flujo de caja', detalle: `El flujo neto acumulado es ${fmtMXN0(flujo)}, resultado de ${fmtMXN0(ingresosCobrados)} cobrados a clientes y ${fmtMXN0(egresosPagados)} pagados a proveedores y contratistas.` },
                    { tone: 'info', titulo: 'Fondo de garantía constituido', detalle: `Se han retenido ${fmtMXN0(totalRet)} como fondo de garantía, que serán liberados conforme avance la recepción formal de los trabajos.` }
                ])}
      </div>`;

            const charts = [
                {
                    id: 'chFlujo', config: {
                        type: 'line',
                        data: {
                            labels: ['Feb', 'Mar', 'Abr', 'May', 'Jun'],
                            datasets: [
                                {
                                    label: 'Ingresos cobrados', data: (() => {
                                        const m = {}; CONTRARECIBOS.forEach(cr => (cr.pagoItems || []).forEach(p => {
                                            const k = new Date(p.fecha).toISOString().slice(0, 7); m[k] = (m[k] || 0) + num(p.importe);
                                        }));
                                        const keys = ['2026-02', '2026-03', '2026-04', '2026-05', '2026-06'];
                                        let acc = 0; return keys.map(k => { acc += (m[k] || 0); return +(acc / 1e6).toFixed(3); });
                                    })(), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.12)', borderWidth: 2.5, pointRadius: 3, tension: .35, fill: true
                                },
                                {
                                    label: 'Egresos pagados', data: (() => {
                                        const m = {};
                                        EST_PAGADAS.forEach(e => { const k = new Date(e.fechaFin).toISOString().slice(0, 7); m[k] = (m[k] || 0) + e.neto; });
                                        (D.ordenesCompra || []).forEach(oc => (oc.pagos || []).forEach(p => {
                                            const k = new Date(p.fechaPago).toISOString().slice(0, 7); m[k] = (m[k] || 0) + num(p.importe);
                                        }));
                                        const keys = ['2026-02', '2026-03', '2026-04', '2026-05', '2026-06'];
                                        let acc = 0; return keys.map(k => { acc += (m[k] || 0); return +(acc / 1e6).toFixed(3); });
                                    })(), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.10)', borderWidth: 2.5, pointRadius: 3, tension: .35, fill: true
                                }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 11 } } },
                                tooltip: { callbacks: { label: c => c.dataset.label + ': $' + c.parsed.y.toFixed(3) + ' M' } }
                            },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + v + 'M', font: { size: 10 } }, grid: { color: '#eef2f7' } }, x: { grid: { display: false }, ticks: { font: { size: 11 } } } }
                        }
                    }
                },
                {
                    id: 'chRetDona', config: {
                        type: 'doughnut',
                        data: {
                            labels: retencionesPorContrato.map(x => x.c.numeroContrato),
                            datasets: [{ data: retencionesPorContrato.map(x => +x.ret.toFixed(2)), backgroundColor: ['#1c63ef', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'], borderWidth: 0, hoverOffset: 5 }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false, cutout: '62%',
                            plugins: {
                                legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 10 } } },
                                tooltip: { callbacks: { label: c => c.label + ': ' + fmtMXN0(c.parsed) } }
                            }
                        }
                    }
                }];
            return { html, charts };
        };

        /* =========================================================
           11. NAVEGACIÓN Y RENDER
           ========================================================= */
        function findPregunta(id) {
            for (const t of TEMAS) {
                const p = t.preguntas.find(x => x.id === id);
                if (p) return { tema: t, pregunta: p };
            }
            return { tema: TEMAS[0], pregunta: TEMAS[0].preguntas[0] };
        }

        function buildNav() {
            const nav = document.getElementById('sbNav');
            nav.innerHTML = TEMAS.map(t => {
                const active = t.preguntas.some(p => p.id === CURRENT);
                return `<div class="mb-0.5">
          <button data-tema="${t.id}" class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg text-left transition-colors ${active ? 'bg-white/[.06] text-white' : 'text-ink-300 hover:bg-white/[.04] hover:text-white'}">
            <span class="flex items-center gap-2.5 min-w-0">
              <i data-lucide="${t.icon}" class="w-[15px] h-[15px] shrink-0 ${active ? 'text-brand-400' : 'text-ink-500'}"></i>
              <span class="text-[12px] font-semibold truncate">${t.titulo}</span>
            </span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0 text-ink-500 transition-transform ${active ? 'rotate-180' : ''}" data-chev="${t.id}"></i>
          </button>
          <div class="mt-0.5 mb-1.5 space-y-0.5 overflow-hidden transition-all ${active ? '' : 'hidden'}" data-body="${t.id}">
            ${t.preguntas.map(p => `
              <button data-q="${p.id}" class="w-full text-left px-3 py-2 pl-9 rounded-lg text-[11.5px] leading-snug transition-all duration-150 ${p.id === CURRENT ? 'q-active font-semibold' : 'text-ink-400 hover:bg-white/[.05] hover:text-ink-100'}">
                ${p.txt}
              </button>`).join('')}
          </div>
        </div>`;
            }).join('');

            nav.querySelectorAll('[data-q]').forEach(btn => {
                btn.addEventListener('click', () => { CURRENT = btn.dataset.q; render(); });
            });
            nav.querySelectorAll('[data-tema]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.tema;
                    const body = nav.querySelector(`[data-body="${id}"]`);
                    const chev = nav.querySelector(`[data-chev="${id}"]`);
                    if (body) { body.classList.toggle('hidden'); chev.classList.toggle('rotate-180'); }
                });
            });

            if (window.lucide) lucide.createIcons();
        }

        function render() {
            destroyCharts();
            const { tema, pregunta } = findPregunta(CURRENT);

            /* Header */
            document.getElementById('preguntaTitulo').textContent = pregunta.txt;
            document.getElementById('breadcrumb').innerHTML =
                `<span class="text-ink-400">Dashboard</span>
         <i data-lucide="chevron-right" class="w-3 h-3 text-ink-300"></i>
         <span class="text-brand-600 font-semibold">${tema.titulo}</span>`;

            /* Contenido */
            const view = VIEWS[CURRENT] || VIEWS['resumen'];
            const out = view();
            const cont = document.getElementById('contenido');
            cont.innerHTML = out.html;
            cont.scrollTop = 0;

            if (window.lucide) lucide.createIcons();

            (out.charts || []).forEach(ch => {
                const el = document.getElementById(ch.id);
                if (!el) return;
                try {
                    const c = new Chart(el.getContext('2d'), ch.config);
                    CHARTS.push(c);
                } catch (e) { console.warn('Chart error', ch.id, e); }
            });

            if (typeof out.after === 'function') out.after();

            buildNav();
        }

        /* =========================================================
           12. INICIALIZACIÓN
           ========================================================= */
        function init() {
            const g = D.generales;
            document.getElementById('sbNombre').textContent = g.descripcion;
            document.getElementById('sbUbicacion').textContent = g.ubicacion;
            document.getElementById('sbMonto').textContent = fmtMXN0(g.montoTotal);
            const dias = daysBetween(g.fechaInicia, g.fechaTermina);
            document.getElementById('sbPlazo').textContent = Math.round(dias / 7) + ' sem';
            document.getElementById('sbFechas').innerHTML =
                `<i data-lucide="calendar-range" class="w-3 h-3"></i><span>${fmtDate(g.fechaInicia)} → ${fmtDate(g.fechaTermina)}</span>`;

            document.getElementById('fechaCorte').textContent = 'Corte: ' + fmtDate(TODAY);

            if (window.lucide) lucide.createIcons();
            render();
        }

        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState !== 'loading') init();
    </script>
</body>
</html>
