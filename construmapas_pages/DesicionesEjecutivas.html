    <script>
        /* =========================================================
           1. CARGA Y NORMALIZACIÓN DE DATOS
           ========================================================= */
        const RAW = JSON.parse(document.getElementById('construMapasData').textContent);
        const D = {};
        Object.keys(RAW).forEach(k => D[k] = RAW[k]);

        /* Fecha de corte (contexto temporal de la obra: 2026) */
        const TODAY = new Date('2026-06-15T00:00:00');

        /* Helpers */
        const byId = (arr, key = 'guid') => (arr || []).reduce((m, x) => { m[x[key]] = x; return m; }, {});
        const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
        const pct = v => (num(v) * 100);

        const MAPS = {
            concepto: byId(D.conceptos),
            partidaConcepto: byId(D.partidaConceptos),
            programa: byId(D.programas),
            contratista: byId(D.contratistas),
            contrato: byId(D.contratos),
            almacen: byId(D.almacenes),
            material: byId(D.materiales),
            manoObra: byId(D.manosObra),
            equipo: byId(D.equipos),
            auxiliar: byId(D.auxiliares),
            universal: byId(D.insumosUniversales),
            precioUnitario: byId(D.preciosUnitarios),
            cliente: byId(D.clientesObra),
            ordenCompra: byId(D.ordenesCompra),
            empleado: byId(D.empleados),
            tipoContratista: byId(D.tiposContratistas)
        };

        function insumo(g) {
            return MAPS.material[g] || MAPS.manoObra[g] || MAPS.equipo[g] || MAPS.auxiliar[g] || MAPS.universal[g] || MAPS.precioUnitario[g] || null;
        }
        function insumoNombre(g) {
            const i = insumo(g); return i ? i.descripcionCorta || i.descripcion : g;
        }

        /* =========================================================
           2. FORMATEADORES
           ========================================================= */
        const fmtMXN = n => '$' + num(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtMXN0 = n => '$' + num(n).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        const fmtNum = (n, d = 0) => num(n).toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d });
        const fmtPct = (n, d = 1) => num(n).toFixed(d) + '%';
        const fmtDate = s => {
            if (!s) return '—';
            const dt = new Date(s);
            if (isNaN(dt)) return '—';
            return dt.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
        };
        const fmtDateShort = s => {
            if (!s) return '—';
            const dt = new Date(s);
            if (isNaN(dt)) return '—';
            return dt.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
        };
        const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
        const clamp01 = v => Math.max(0, Math.min(1, v));

        /* =========================================================
           3. CÁLCULOS DE AVANCE FÍSICO
           ========================================================= */
        /* Índice de avancePartidaConceptos */
        const APC = byId(D.avancePartidaConceptos);
        /* Semana del avance al que pertenece cada APC */
        const apcSemana = {};
        const apcFecha = {};
        (D.avances || []).forEach(av => {
            (av.conceptoItems || []).forEach(g => {
                if (APC[g]) { apcSemana[g] = av.programaEstimacionGuid; apcFecha[g] = av.fecha; }
            });
        });

        /* Agregado por partidaConcepto */
        const PCA = {};
        (D.partidaConceptos || []).forEach(pc => {
            const c = MAPS.concepto[pc.conceptoGuid] || { descripcionCorta: '—', codigo: '—', unidad: '—' };
            PCA[pc.guid] = {
                guid: pc.guid,
                pc: pc,
                concepto: c,
                cantContratada: num(pc.cantidadContratada),
                puContratado: num(pc.precioUnitarioContratado),
                cantPlaneada: num(pc.cantidadPlaneada),
                puPlaneado: num(pc.precioUnitarioPlaneado),
                importeContratado: num(pc.cantidadContratada) * num(pc.precioUnitarioContratado),
                importePlaneado: num(pc.cantidadPlaneada || pc.cantidadContratada) * num(pc.precioUnitarioPlaneado),
                cantReal: 0,
                importeReal: 0,
                ultimaFecha: null,
                semanas: new Set()
            };
        });
        (D.avancePartidaConceptos || []).forEach(a => {
            const t = PCA[a.partidaConceptoGuid];
            if (!t) return;
            t.cantReal += num(a.cantidad);
            t.importeReal += num(a.cantidad) * num(a.precioUnitario);
            const f = apcFecha[a.guid];
            if (f && (!t.ultimaFecha || new Date(f) > new Date(t.ultimaFecha))) t.ultimaFecha = f;
            if (apcSemana[a.guid]) t.semanas.add(apcSemana[a.guid]);
        });

        /* Partidas */
        const PARTIDAS = [];
        (D.frentes || []).forEach(fr => {
            (fr.partidas || []).forEach(p => {
                const pcs = (p.partidaConceptosGuid || []).map(g => PCA[g]).filter(Boolean);
                const impContr = pcs.reduce((s, x) => s + x.importeContratado, 0);
                const impReal = pcs.reduce((s, x) => s + x.importeReal, 0);
                const impPlan = pcs.reduce((s, x) => s + x.importePlaneado, 0);
                const prog = MAPS.programa[p.programaContratadoGuid] || null;
                const partida = {
                    guid: p.guid, codigo: p.codigo, descripcion: p.descripcion,
                    frenteGuid: fr.guid, frenteCodigo: fr.codigo, frenteNombre: fr.descripcion,
                    contratoGuid: p.contratoGuid,
                    programa: prog,
                    fechaInicio: prog ? prog.fechaInicia : null,
                    fechaFin: prog ? prog.fechaTermina : null,
                    conceptos: pcs,
                    importeContratado: impContr,
                    importeReal: impReal,
                    importePlaneado: impPlan,
                    avanceReal: impContr > 0 ? impReal / impContr : 0,
                    avanceProg: pctProgramado(prog ? prog.fechaInicia : null, prog ? prog.fechaTermina : null),
                    margen: impContr - impPlan,
                    margenPct: impContr > 0 ? (impContr - impPlan) / impContr : 0
                };
                partida.desviacion = partida.avanceReal - partida.avanceProg;
                partida.ultimaFecha = pcs.reduce((mx, x) => (x.ultimaFecha && (!mx || new Date(x.ultimaFecha) > new Date(mx))) ? x.ultimaFecha : mx, null);
                PARTIDAS.push(partida);
            });
        });

        function pctProgramado(ini, fin, hoy = TODAY) {
            if (!ini || !fin) return 0;
            const a = new Date(ini).getTime(), b = new Date(fin).getTime(), h = hoy.getTime();
            if (h <= a) return 0;
            if (h >= b) return 1;
            return (h - a) / (b - a);
        }

        /* Totales de obra */
        const OBRA = {
            importeContratado: PARTIDAS.reduce((s, p) => s + p.importeContratado, 0),
            importeReal: PARTIDAS.reduce((s, p) => s + p.importeReal, 0),
            importePlaneado: PARTIDAS.reduce((s, p) => s + p.importePlaneado, 0),
            importeProgramado: PARTIDAS.reduce((s, p) => s + p.importeContratado * p.avanceProg, 0)
        };
        OBRA.avanceReal = OBRA.importeContratado ? OBRA.importeReal / OBRA.importeContratado : 0;
        OBRA.avanceProg = OBRA.importeContratado ? OBRA.importeProgramado / OBRA.importeContratado : 0;
        OBRA.desviacion = OBRA.avanceReal - OBRA.avanceProg;

        /* =========================================================
           4. CURVA S
           ========================================================= */
        function curvaS() {
            const semanas = (D.programas || []).slice().sort((a, b) => new Date(a.fechaInicia) - new Date(b.fechaInicia));
            const labels = [], plan = [], real = [];
            let acumReal = 0;
            const realPorSemana = {};
            (D.avances || []).forEach(av => {
                let imp = 0;
                (av.conceptoItems || []).forEach(g => {
                    const a = APC[g]; if (a) imp += num(a.cantidad) * num(a.precioUnitario);
                });
                realPorSemana[av.programaEstimacionGuid] = (realPorSemana[av.programaEstimacionGuid] || 0) + imp;
            });
            semanas.forEach(w => {
                const finSem = new Date(w.fechaTermina);
                let planAcum = 0;
                PARTIDAS.forEach(p => {
                    if (!p.fechaInicio || !p.fechaFin) return;
                    const a = new Date(p.fechaInicio).getTime(), b = new Date(p.fechaFin).getTime();
                    const t = clamp01((finSem.getTime() - a) / (b - a));
                    planAcum += p.importeContratado * t;
                });
                acumReal += (realPorSemana[w.guid] || 0);
                labels.push(w.nombre.replace('Semana ', 'S'));
                plan.push(+(planAcum / 1e6).toFixed(3));
                real.push(+(acumReal / 1e6).toFixed(3));
            });
            return { labels, plan, real, semanas };
        }
        const S = curvaS();

        /* =========================================================
           5. ESTIMACIONES / FINANZAS
           ========================================================= */
        const ESTIMACIONES = (D.estimaciones || []).map(e => {
            const estimado = num(e.normal) + num(e.aditiva) - num(e.deductiva) + num(e.obraExtraordinaria);
            const amort = num(e.importeAmortizacionAnticipo);
            const ret = num(e.importeRetencion1) + num(e.importeRetencion2) + num(e.importeRetencion3);
            const iva = estimado * num(e.porcientoIVA);
            const neto = estimado - amort - ret + iva;
            return Object.assign({}, e, { estimado, amort, ret, iva, neto });
        });
        const EST_PAGADAS = ESTIMACIONES.filter(e => e.estado === 'Pagada');
        const TOTAL_ESTIMADO = ESTIMACIONES.reduce((s, e) => s + e.estimado, 0);
        const TOTAL_IVA = ESTIMACIONES.reduce((s, e) => s + e.iva, 0);
        const TOTAL_NETO = ESTIMACIONES.reduce((s, e) => s + e.neto, 0);
        const TOTAL_AMORT = ESTIMACIONES.reduce((s, e) => s + e.amort, 0);
        const TOTAL_RET = ESTIMACIONES.reduce((s, e) => s + e.ret, 0);

        /* Pagos por contratista */
        function pagosPorContratista() {
            const r = {};
            ESTIMACIONES.forEach(e => {
                const c = MAPS.contrato[e.contratoGuid];
                if (!c) return;
                const k = c.contratistaGuid;
                if (!r[k]) r[k] = { contratistaGuid: k, pagado: 0, estimado: 0, porPagar: 0, n: 0, retenido: 0 };
                r[k].estimado += e.estimado;
                r[k].retenido += e.ret;
                r[k].n++;
                if (e.estado === 'Pagada') r[k].pagado += e.neto;
                else r[k].porPagar += e.neto;
            });
            return Object.values(r).map(x => ({ ...x, nombre: (MAPS.contratista[x.contratistaGuid] || {}).nombre || '—' }))
                .sort((a, b) => b.estimado - a.estimado);
        }

        /* Anticipos */
        function estadoAnticipos() {
            return (D.contratos || []).map(c => {
                const ests = ESTIMACIONES.filter(e => e.contratoGuid === c.guid);
                const amort = ests.reduce((s, e) => s + e.amort, 0);
                const ret = ests.reduce((s, e) => s + e.ret, 0);
                return {
                    contrato: c,
                    contratista: MAPS.contratista[c.contratistaGuid] || { nombre: '—' },
                    anticipoOtorgado: num(c.anticipo),
                    amortizado: amort,
                    saldo: num(c.anticipo) - amort,
                    pctAmort: num(c.anticipo) > 0 ? amort / num(c.anticipo) : 0,
                    fondoGarantia: ret,
                    importe: num(c.importe)
                };
            }).sort((a, b) => b.saldo - a.saldo);
        }

        /* Cartera por cobrar */
        const CONTRARECIBOS = (D.contraRecibos || []).map(cr => {
            const pagado = (cr.pagoItems || []).reduce((s, p) => s + num(p.importe), 0);
            const factura = num(cr.facturaRelacionadaImporte);
            return Object.assign({}, cr, { pagado, saldo: factura - pagado });
        });

        /* =========================================================
           6. INVENTARIO / ALMACÉN
           ========================================================= */
        function stockPorAlmacen() {
            /* stock[almacenGuid][productoGuid] = {cantidad, valor} */
            const st = {};
            const add = (alm, prod, cant, precio) => {
                if (!alm || !prod) return;
                st[alm] = st[alm] || {};
                st[alm][prod] = st[alm][prod] || { cantidad: 0, valor: 0 };
                st[alm][prod].cantidad += cant;
                st[alm][prod].valor += cant * num(precio);
            };
            (D.entradasAlmacen || []).forEach(e => {
                const all = [].concat(e.materialDetalles || [], e.manoObraDetalles || [], e.equipoDetalles || [], e.auxiliarDetalles || [], e.insumoUniversalDetalles || []);
                all.forEach(d => { if (d.procesado) add(e.almacenGuid, d.productoGuid, num(d.cantidad), num(d.precio)); });
            });
            (D.salidasAlmacen || []).forEach(e => {
                const all = [].concat(e.materialDetalles || [], e.manoObraDetalles || [], e.equipoDetalles || [], e.auxiliarDetalles || [], e.insumoUniversalDetalles || []);
                all.forEach(d => { if (d.procesado) add(e.almacenGuid, d.productoGuid, -num(d.cantidad), num(d.precio)); });
            });
            (D.traspasosAlmacen || []).forEach(e => {
                const all = [].concat(e.materialDetalles || [], e.manoObraDetalles || [], e.equipoDetalles || [], e.auxiliarDetalles || [], e.insumoUniversalDetalles || []);
                all.forEach(d => {
                    if (!d.procesado) return;
                    add(e.almacenOrigenGuid, d.productoGuid, -num(d.cantidad), num(d.precio));
                    add(e.almacenDestinoGuid, d.productoGuid, num(d.cantidad), num(d.precio));
                });
            });
            (D.devolucionesAlmacen || []).forEach(e => {
                const all = [].concat(e.materialDetalles || [], e.manoObraDetalles || [], e.equipoDetalles || [], e.auxiliarDetalles || [], e.insumoUniversalDetalles || []);
                all.forEach(d => { if (d.procesado) add(e.almacenGuid, d.productoGuid, -num(d.cantidad), num(d.precio)); });
            });
            return st;
        }
        const STOCK = stockPorAlmacen();

        /* Stock total por material */
        function stockTotal(productoGuid) {
            let c = 0, v = 0;
            Object.keys(STOCK).forEach(a => {
                if (STOCK[a][productoGuid]) { c += STOCK[a][productoGuid].cantidad; v += STOCK[a][productoGuid].valor; }
            });
            return { cantidad: c, valor: v };
        }
        function stockPorAlmacenProducto(productoGuid) {
            return Object.keys(STOCK).filter(a => STOCK[a][productoGuid] && Math.abs(STOCK[a][productoGuid].cantidad) > 1e-9)
                .map(a => ({ almacen: MAPS.almacen[a] || { nombre: a }, ...STOCK[a][productoGuid] }));
        }

        /* Entradas totales por material (para rotación) */
        function entradasTotales(productoGuid) {
            let c = 0;
            (D.entradasAlmacen || []).forEach(e => {
                const all = [].concat(e.materialDetalles || [], e.manoObraDetalles || [], e.equipoDetalles || [], e.auxiliarDetalles || [], e.insumoUniversalDetalles || []);
                all.forEach(d => { if (d.productoGuid === productoGuid && d.procesado) c += num(d.cantidad); });
            });
            return c;
        }

        /* =========================================================
           7. ORDENES DE COMPRA
           ========================================================= */
        const OC_ITEMS = [];
        (D.ordenesCompra || []).forEach(oc => {
            const prov = MAPS.contratista[oc.proveedorGuid] || { nombre: '—' };
            const groups = [
                ['Material', oc.materialItems], ['ManoObra', oc.manoObraItems], ['Equipo', oc.equipoItems],
                ['Auxiliar', oc.auxiliarItems], ['Universal', oc.insumoUniversalItems]
            ];
            groups.forEach(([tipo, arr]) => {
                (arr || []).forEach(it => {
                    OC_ITEMS.push({
                        oc, item: it, tipo,
                        proveedor: prov,
                        producto: insumo(it.productoGuid),
                        productoNombre: insumoNombre(it.productoGuid),
                        varPrecio: num(it.precio) > 0 && num(it.precioRecibido) > 0 ? (num(it.precioRecibido) - num(it.precio)) / num(it.precio) : null,
                        pendiente: num(it.cantidad) - num(it.cantidadRecibida)
                    });
                });
            });
        });

        /* Retrasos por proveedor */
        function retrasosProveedor() {
            const r = {};
            (D.entradasAlmacen || []).forEach(en => {
                const oc = MAPS.ordenCompra[en.ordenCompraGuid];
                if (!oc) return;
                const prov = MAPS.contratista[oc.proveedorGuid];
                if (!prov) return;
                const dias = Math.max(0, daysBetween(oc.fecha, en.fecha));
                if (!r[prov.guid]) r[prov.guid] = { proveedor: prov, totalDias: 0, n: 0, maxDias: 0 };
                r[prov.guid].totalDias += dias;
                r[prov.guid].n++;
                r[prov.guid].maxDias = Math.max(r[prov.guid].maxDias, dias);
            });
            return Object.values(r).map(x => ({ ...x, promedio: x.totalDias / x.n }))
                .sort((a, b) => b.promedio - a.promedio);
        }

        /* =========================================================
           8. UI HELPERS
           ========================================================= */
        let CHARTS = [];
        function destroyCharts() { CHARTS.forEach(c => { try { c.destroy(); } catch (e) { } }); CHARTS = []; }

        function toneClasses(tone) {
            switch (tone) {
                case 'good': return { bg: 'bg-emerald-50', bd: 'border-emerald-200', tx: 'text-emerald-700', ic: 'bg-emerald-100 text-emerald-600', bar: 'bg-emerald-500' };
                case 'bad': return { bg: 'bg-red-50', bd: 'border-red-200', tx: 'text-red-700', ic: 'bg-red-100 text-red-600', bar: 'bg-red-500' };
                case 'warn': return { bg: 'bg-amber-50', bd: 'border-amber-200', tx: 'text-amber-700', ic: 'bg-amber-100 text-amber-600', bar: 'bg-amber-500' };
                case 'info': return { bg: 'bg-brand-50', bd: 'border-brand-200', tx: 'text-brand-700', ic: 'bg-brand-100 text-brand-600', bar: 'bg-brand-500' };
                default: return { bg: 'bg-white', bd: 'border-ink-200', tx: 'text-ink-700', ic: 'bg-ink-100 text-ink-600', bar: 'bg-ink-400' };
            }
        }

        function kpiCard(o) {
            const t = toneClasses(o.tone);
            return `
      <div class="card p-4 hover:shadow-lift transition-shadow duration-200 fade-in">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div class="text-[10.5px] font-bold uppercase tracking-[.12em] text-ink-500 leading-tight">${o.label}</div>
            <div class="kpi-value text-[26px] font-extrabold mt-2 ${t.tx}">${o.value}</div>
            ${o.sub ? `<div class="text-[11.5px] text-ink-500 mt-1.5 leading-snug">${o.sub}</div>` : ''}
          </div>
          ${o.icon ? `<div class="w-9 h-9 rounded-xl ${t.ic} flex items-center justify-center shrink-0"><i data-lucide="${o.icon}" class="w-[18px] h-[18px]"></i></div>` : ''}
        </div>
        ${o.progress !== undefined ? `
          <div class="mt-3.5 h-1.5 rounded-full bg-ink-100 overflow-hidden">
            <div class="h-full ${t.bar} rounded-full transition-all duration-700" style="width:${Math.max(0, Math.min(100, o.progress))}%"></div>
          </div>` : ''}
      </div>`;
        }

        function sectionTitle(txt, sub) {
            return `<div class="flex items-end justify-between gap-4 mb-3.5 mt-1">
        <div>
          <h2 class="text-[14px] font-bold text-ink-900 tracking-tight">${txt}</h2>
          ${sub ? `<p class="text-[11.5px] text-ink-500 mt-0.5">${sub}</p>` : ''}
        </div>
      </div>`;
        }

        function chartCard(id, title, sub, height = 280, extra = '') {
            return `<div class="card p-4 ${extra}">
        <div class="mb-3">
          <h3 class="text-[12.5px] font-bold text-ink-900">${title}</h3>
          ${sub ? `<p class="text-[11px] text-ink-500 mt-0.5">${sub}</p>` : ''}
        </div>
        <div style="height:${height}px" class="relative"><canvas id="${id}"></canvas></div>
      </div>`;
        }

        function tableCard(title, cols, rows, opts = {}) {
            const maxH = opts.maxH || 380;
            if (!rows.length) {
                return `<div class="card p-4">
          <h3 class="text-[12.5px] font-bold text-ink-900 mb-3">${title}</h3>
          <div class="flex flex-col items-center justify-center py-12 text-ink-400">
            <i data-lucide="inbox" class="w-8 h-8 mb-2"></i>
            <span class="text-[12px] font-medium">Sin datos disponibles para este filtro</span>
          </div>
        </div>`;
            }
            return `<div class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-[12.5px] font-bold text-ink-900">${title}</h3>
          <span class="text-[10.5px] font-semibold text-ink-500 bg-ink-50 px-2 py-0.5 rounded-md num">${rows.length} registros</span>
        </div>
        <div class="overflow-auto rounded-lg border border-ink-200" style="max-height:${maxH}px">
          <table class="min-w-full text-[11.5px]">
            <thead>
              <tr>${cols.map(c => `<th class="px-3 py-2.5 text-left font-bold text-ink-600 uppercase tracking-wider text-[9.5px] whitespace-nowrap ${c.align === 'r' ? 'text-right' : ''}">${c.t}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${rows.map((r, i) => `<tr class="${i % 2 ? 'row-alt' : ''} hover:bg-brand-50/50 transition-colors border-t border-ink-100">
                ${r.map((c, j) => `<td class="px-3 py-2.5 align-middle ${cols[j].align === 'r' ? 'text-right num' : 'num'} ${cols[j].cls || 'text-ink-700'}">${c}</td>`).join('')}
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
        }

        function semaforo(v, invert = false) {
            /* v = desviación en puntos porcentuales (0.05 = 5 pp) */
            const x = v * 100;
            let color = 'bg-emerald-500', txt = 'text-emerald-700', label = 'En rango';
            if (invert) {
                if (x > 5) { color = 'bg-red-500'; txt = 'text-red-700'; label = 'Crítico'; }
                else if (x > 0) { color = 'bg-amber-500'; txt = 'text-amber-700'; label = 'Atención'; }
            } else {
                if (x < -5) { color = 'bg-red-500'; txt = 'text-red-700'; label = 'Crítico'; }
                else if (x < -1.5) { color = 'bg-amber-500'; txt = 'text-amber-700'; label = 'Atención'; }
            }
            return `<span class="inline-flex items-center gap-1.5"><span class="sem ${color}"></span><span class="text-[10.5px] font-semibold ${txt}">${label}</span></span>`;
        }

        function chip(txt, tone = 'default') {
            const m = { good: 'bg-emerald-100 text-emerald-700', bad: 'bg-red-100 text-red-700', warn: 'bg-amber-100 text-amber-700', info: 'bg-brand-100 text-brand-700', default: 'bg-ink-100 text-ink-600' };
            return `<span class="chip ${m[tone]}">${txt}</span>`;
        }

        function insightPanel(items) {
            if (!items || !items.length) return '';
            const toneMap = { critical: { bg: 'bg-red-50', bd: 'border-red-200', ic: 'text-red-600', icon: 'alert-octagon' }, warn: { bg: 'bg-amber-50', bd: 'border-amber-200', ic: 'text-amber-600', icon: 'alert-triangle' }, good: { bg: 'bg-emerald-50', bd: 'border-emerald-200', ic: 'text-emerald-600', icon: 'check-circle-2' }, info: { bg: 'bg-brand-50', bd: 'border-brand-200', ic: 'text-brand-600', icon: 'info' } };
            return `<div class="card p-4 mt-1">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="lightbulb" class="w-4 h-4 text-amber-500"></i>
          <h3 class="text-[12.5px] font-bold text-ink-900">Insights y alertas clave</h3>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-2.5">
          ${items.map(it => {
                const t = toneMap[it.tone || 'info'];
                return `<div class="${t.bg} ${t.bd} border rounded-lg px-3 py-2.5 flex gap-2.5">
              <i data-lucide="${t.icon}" class="w-4 h-4 ${t.ic} shrink-0 mt-0.5"></i>
              <div class="min-w-0">
                <div class="text-[11.5px] font-bold text-ink-800 leading-tight">${it.titulo}</div>
                <div class="text-[11px] text-ink-600 mt-0.5 leading-snug">${it.detalle}</div>
              </div>
            </div>`;
            }).join('')}
        </div>
      </div>`;
        }

        /* =========================================================
           9. DEFINICIÓN DE TEMAS Y PREGUNTAS
           ========================================================= */
        const TEMAS = [
            {
                id: 'resumen', titulo: 'Resumen Ejecutivo', icon: 'layout-dashboard', preguntas: [
                    { id: 'resumen', txt: 'Estado general de la obra', icon: 'gauge' }
                ]
            },
            {
                id: 'tiempos', titulo: 'Control de Tiempos y Avances', icon: 'calendar-clock', preguntas: [
                    { id: 'avance-general', txt: '¿Cuál es el porcentaje de avance real contra lo programado?', icon: 'trending-up' },

                    { id: 'partidas-sin-movimiento', txt: 'Partidas que debieron iniciar y no tienen movimiento', icon: 'circle-slash-2' },

                ]
            },
            {
                id: 'costos', titulo: 'Costos y Finanzas', icon: 'wallet', preguntas: [
                    { id: 'pagos-contratista', txt: '¿Cuánto dinero se le ha pagado a un contratista?', icon: 'banknote' },
                    { id: 'estimaciones-mes', txt: 'Monto de estimaciones del último mes', icon: 'receipt' },
                    { id: 'margen', txt: 'Contratos con margen de ganancia negativo', icon: 'trending-down' },
                    { id: 'precios-materiales', txt: 'Materiales con mayor alza de precio', icon: 'arrow-up-right' },
                    { id: 'anticipos', txt: 'Amortización de anticipos y fondo de garantía', icon: 'percent' }
                ]
            },
            {
                id: 'almacen', titulo: 'Almacén y Logística', icon: 'package', preguntas: [
                    { id: 'stock-minimo', txt: 'Materiales agotados o bajo stock mínimo', icon: 'package-x' },
                    { id: 'materiales-proxima', txt: 'Materiales requeridos para partidas de la próxima semana', icon: 'truck' },

                ])}

                                label: 'Desviación (pp)', data: atrasadas.map(p => +(p.desviacion * 100).toFixed(2)),

        /* ---------- 4. PARTIDAS SIN MOVIMIENTO ---------- */
        VIEWS['partidas-sin-movimiento'] = () => {

        /* ---------- 8. MARGEN NEGATIVO ---------- */

        /* ---------- 11. STOCK MÍNIMO ---------- */
        VIEWS['stock-minimo'] = () => {
            const rows = D.materiales.map(m => {
                const st = stockTotal(m.guid);
                const min = num(m.stockMinimo);
                const estado = st.cantidad <= 0 && min > 0 ? 'agotado' : (st.cantidad < min ? 'bajo' : 'ok');
                return { m, stock: st.cantidad, valor: st.valor, min, estado, faltante: Math.max(0, min - st.cantidad) };
            }).filter(x => x.estado !== 'ok').sort((a, b) => {
                const order = { agotado: 0, bajo: 1 };
                if (order[a.estado] !== order[b.estado]) return order[a.estado] - order[b.estado];
                return (b.faltante * b.m.precio) - (a.faltante * a.m.precio);
            });

            const agotados = rows.filter(x => x.estado === 'agotado');

                        `<span class="font-semibold text-ink-700">${fmtNum(x.faltante, 2)}</span>`,
                        `<span class="text-[10.5px] text-ink-500">${x.m.unidad}</span>`,
                        `<span class="text-ink-700 font-semibold">${fmtMXN0(x.faltante * x.m.precio)}</span>`,
                        x.estado === 'agotado' ? chip('Agotado', 'bad') : chip('Bajo mínimo', 'warn')
                    ];
                }), { maxH: 420 })}

        ${insightPanel([
                    { tone: 'critical', titulo: 'Materiales agotados', detalle: agotados.length ? `${agotados.map(x => x.m.descripcionCorta).join(', ')} se encuentran sin existencia, lo que puede detener frentes de trabajo activos.` : 'No hay materiales agotados.' },
                    { tone: 'warn', titulo: 'Riesgo de detención de obra', detalle: `${rows.length} insumo(s) requieren reposición inmediata con un valor estimado de ${fmtMXN0(valorFaltante)}.` }
                ])}
      </div>`;

            const charts = [{
                id: 'chStock', config: {
                    type: 'bar',
                    data: {
                        labels: rows.map(x => x.m.descripcionCorta),
                        datasets: [
                            { label: 'Existencia', data: rows.map(x => +x.stock.toFixed(2)), backgroundColor: rows.map(x => x.estado === 'agotado' ? '#ef4444' : '#f59e0b'), borderRadius: 6, barPercentage: .6 },
                            { label: 'Mínimo', data: rows.map(x => +x.min.toFixed(2)), backgroundColor: '#cbd5e1', borderRadius: 6, barPercentage: .6 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 11 } } } },
                        scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#eef2f7' } }, x: { grid: { display: false }, ticks: { font: { size: 9.5 }, maxRotation: 35, minRotation: 0 } } }
                    }
                }
            }];
            return { html, charts };
        };

        /* ---------- 12. MATERIALES PRÓXIMA SEMANA ---------- */
        VIEWS['materiales-proxima'] = () => {
            const semanaActual = (D.programas || []).find(w => {
                const a = new Date(w.fechaInicia), b = new Date(w.fechaTermina);
                return TODAY >= a && TODAY <= b;
            });
            const hoy = new Date(TODAY);
            const en7 = new Date(hoy.getTime() + 7 * 86400000);

            const proximas = PARTIDAS.filter(p => {
                if (!p.fechaInicio) return false;
                const fi = new Date(p.fechaInicio);
                return fi >= hoy && fi <= en7;
            });

            /* Explosión de insumos */
            const req = {};
            const detalle = [];
            proximas.forEach(p => {
                p.conceptos.forEach(pc => {
                    const c = pc.concepto;
                    const pu = c.matrizPUGuid ? MAPS.precioUnitario[c.matrizPUGuid] : null;
                    const pendiente = Math.max(0, pc.cantContratada - pc.cantReal);
                    if (pu && (pu.materiales || []).length) {
                        (pu.materiales || []).forEach(mi => {
                            const cant = num(mi.cantidad) * pendiente;
                            if (cant <= 0) return;
                            req[mi.insumoGuid] = (req[mi.insumoGuid] || 0) + cant;
                            detalle.push({ partida: p, concepto: c, insumoGuid: mi.insumoGuid, cantidad: cant });
                        });
                    } else {
                        detalle.push({ partida: p, concepto: c, insumoGuid: null, cantidad: 0 });
                    }
                });
            });

            const reqRows = Object.entries(req).map(([g, cant]) => {
                const ins = insumo(g);
                const st = stockTotal(g);
                const faltante = Math.max(0, cant - st.cantidad);
                return { insumo: ins, guid: g, requerido: cant, stock: st.cantidad, faltante, valorFaltante: faltante * (ins ? num(ins.precio) : 0) };
            }).sort((a, b) => b.valorFaltante - a.valorFaltante);

            const totalFaltante = reqRows.reduce((s, x) => s + x.valorFaltante, 0);

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Partidas que inician', value: fmtNum(proximas.length), sub: `Entre ${fmtDateShort(hoy)} y ${fmtDateShort(en7)}`, icon: 'play-circle', tone: 'info' })}
          ${kpiCard({ label: 'Insumos requeridos', value: fmtNum(reqRows.length), sub: 'Materiales explosión de precios unitarios', icon: 'package-search', tone: 'info' })}
          ${kpiCard({ label: 'Insumos con déficit', value: fmtNum(reqRows.filter(x => x.faltante > 0).length), sub: 'Requerido mayor al stock disponible', icon: 'alert-triangle', tone: 'warn' })}
          ${kpiCard({ label: 'Compra requerida', value: fmtMXN0(totalFaltante), sub: 'Valor estimado de reposición', icon: 'shopping-cart', tone: 'bad' })}
        </div>

        ${tableCard('Partidas que inician en los próximos 7 días',
                [{ t: 'Partida' }, { t: 'Frente' }, { t: 'Contratista' }, { t: 'Inicia' }, { t: 'Importe', align: 'r' }, { t: 'Conceptos', align: 'r' }],
                proximas.map(p => {
                    const c = MAPS.contrato[p.contratoGuid];
                    const ct = c ? MAPS.contratista[c.contratistaGuid] : null;
                    return [
                        `<div class="font-semibold text-ink-800">${p.codigo} · ${p.descripcion}</div>`,
                        `<span class="text-[10.5px] text-ink-600">${p.frenteNombre.replace('Frente de ', '')}</span>`,
                        `<span class="text-[10.5px] text-ink-600">${ct ? ct.nombre : '—'}</span>`,
                        `<span class="text-[10.5px] text-ink-700 font-semibold">${fmtDate(p.fechaInicio)}</span>`,
                        fmtMXN0(p.importeContratado), fmtNum(p.conceptos.length)
                    ];
                }), { maxH: 220 })}

        ${tableCard('Materiales requeridos y disponibilidad en almacén',
                    [{ t: 'Material' }, { t: 'Requerido', align: 'r' }, { t: 'Stock actual', align: 'r' }, { t: 'Déficit', align: 'r' }, { t: 'Unidad' }, { t: 'Valor déficit', align: 'r' }, { t: 'Estado' }],
                    reqRows.map(x => [
                        `<div class="font-semibold text-ink-800">${x.insumo ? x.insumo.descripcionCorta : x.guid}</div><div class="text-[10px] text-ink-500">${x.insumo ? x.insumo.codigo : ''}</div>`,
                        fmtNum(x.requerido, 2), fmtNum(x.stock, 2),
                        `<span class="${x.faltante > 0 ? 'text-red-600 font-bold' : 'text-emerald-600 font-semibold'}">${fmtNum(x.faltante, 2)}</span>`,
                        `<span class="text-[10.5px] text-ink-500">${x.insumo ? x.insumo.unidad : ''}</span>`,
                        `<span class="text-ink-700 font-semibold">${fmtMXN0(x.valorFaltante)}</span>`,
                        x.faltante <= 0 ? chip('Cubierto', 'good') : chip('Requiere compra', 'bad')
                    ]), { maxH: 360 })}

        ${insightPanel([
                        { tone: proximas.length ? 'info' : 'good', titulo: 'Arranque de partidas', detalle: proximas.length ? `${proximas.map(p => p.codigo + ' · ' + p.descripcion).join(', ')} inician en los próximos 7 días.` : 'No hay partidas programadas para iniciar en los próximos 7 días.' },
                        { tone: 'critical', titulo: 'Déficit de materiales', detalle: reqRows.filter(x => x.faltante > 0).length ? `Se requiere adquirir ${reqRows.filter(x => x.faltante > 0).map(x => x.insumo ? x.insumo.descripcionCorta : '').join(', ')} antes del inicio de los trabajos.` : 'Todos los materiales requeridos están cubiertos por el stock actual.' }
                    ])}
      </div>`;
            return { html, charts: [] };
        };

        /* ---------- 13. OC NO SURTIDAS ---------- */
        VIEWS['oc-no-surtidas'] = () => {
            const pendientes = OC_ITEMS.filter(x => x.pendiente > 0.001)
                .sort((a, b) => (b.pendiente * num(b.item.precio)) - (a.pendiente * num(a.item.precio)));

            const valorPendiente = pendientes.reduce((s, x) => s + x.pendiente * num(x.item.precio), 0);
            const ocsAfectadas = new Set(pendientes.map(x => x.oc.guid)).size;

            const porProveedor = {};
            pendientes.forEach(x => {
                const k = x.proveedor.nombre;
                porProveedor[k] = (porProveedor[k] || 0) + x.pendiente * num(x.item.precio);
            });

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'OC con surtido incompleto', value: fmtNum(ocsAfectadas), sub: `de ${(D.ordenesCompra || []).length} órdenes registradas`, icon: 'clipboard-x', tone: 'warn' })}
          ${kpiCard({ label: 'Partidas pendientes de entrega', value: fmtNum(pendientes.length), sub: 'Renglones de OC sin recibir totalmente', icon: 'package-minus', tone: 'warn' })}
          ${kpiCard({ label: 'Valor pendiente de surtir', value: fmtMXN0(valorPendiente), sub: 'Importe de materiales no entregados', icon: 'circle-dollar-sign', tone: 'bad' })}
          ${kpiCard({ label: 'Proveedores involucrados', value: fmtNum(Object.keys(porProveedor).length), sub: 'Con entregas parciales pendientes', icon: 'truck', tone: 'info' })}
        </div>

        ${chartCard('chOC', 'Valor pendiente de surtir por proveedor', 'Importe no entregado (MXN)', 300)}

        ${tableCard('Órdenes de compra no surtidas totalmente',
                [{ t: 'OC' }, { t: 'Proveedor' }, { t: 'Material' }, { t: 'Fecha' }, { t: 'Pedido', align: 'r' }, { t: 'Recibido', align: 'r' }, { t: 'Pendiente', align: 'r' }, { t: 'Valor pendiente', align: 'r' }, { t: 'Estado' }],
                pendientes.map(x => [
                    `<div class="font-semibold text-ink-800">OC-${String(x.oc.numeroSecuencia).padStart(3, '0')}</div><div class="text-[10px] text-ink-500">${x.oc.nombre.substring(0, 40)}</div>`,
                    `<span class="text-[10.5px] text-ink-600">${x.proveedor.nombre}</span>`,
                    `<span class="text-[10.5px] text-ink-700">${x.productoNombre}</span>`,
                    `<span class="text-[10.5px] text-ink-500">${fmtDateShort(x.oc.fecha)}</span>`,
                    fmtNum(x.item.cantidad, 2), fmtNum(x.item.cantidadRecibida, 2),
                    `<span class="text-red-600 font-bold">${fmtNum(x.pendiente, 2)}</span>`,
                    `<span class="text-ink-700 font-semibold">${fmtMXN0(x.pendiente * num(x.item.precio))}</span>`,
                    x.oc.estado === 'Pendiente' ? chip('Pendiente', 'bad') : chip(x.oc.estado, x.oc.estado === 'Pagada' ? 'good' : 'warn')
                ]), { maxH: 420 })}

        ${insightPanel([
                    { tone: 'critical', titulo: 'Mayor pendiente de entrega', detalle: pendientes[0] ? `${pendientes[0].proveedor.nombre} mantiene pendiente el surtido de ${pendientes[0].productoNombre} por ${fmtMXN0(pendientes[0].pendiente * num(pendientes[0].item.precio))}.` : '—' },
                    { tone: 'warn', titulo: 'Impacto en programa', detalle: `El valor pendiente de surtir asciende a ${fmtMXN0(valorPendiente)}, lo cual puede comprometer el arranque de las partidas programadas.` }
                ])}
      </div>`;

            const charts = [{
                id: 'chOC', config: {
                    type: 'bar',
                    data: {
                        labels: Object.keys(porProveedor),
                        datasets: [{ label: 'Valor pendiente', data: Object.values(porProveedor).map(v => +v.toFixed(2)), backgroundColor: '#f59e0b', borderRadius: 6, barPercentage: .55 }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmtMXN0(c.parsed.y) } } },
                        scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + (v / 1e6).toFixed(2) + 'M', font: { size: 10 } }, grid: { color: '#eef2f7' } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } }
                    }
                }
            }];
            return { html, charts };
        };

        /* ---------- 14. CEMENTO ---------- */
        VIEWS['cemento'] = () => {
            const mat = MAPS.material['MAT-01'];
            const stockAlm = stockPorAlmacenProducto('MAT-01');
            const total = stockTotal('MAT-01');
            const entradas = entradasTotales('MAT-01');
            let salidas = 0;
            (D.salidasAlmacen || []).forEach(s => (s.materialDetalles || []).forEach(d => { if (d.productoGuid === 'MAT-01' && d.procesado) salidas += num(d.cantidad); }));

            const movimientos = [];
            (D.entradasAlmacen || []).forEach(e => (e.materialDetalles || []).forEach(d => {
                if (d.productoGuid === 'MAT-01') movimientos.push({ fecha: e.fecha, tipo: 'Entrada', almacen: (MAPS.almacen[e.almacenGuid] || {}).nombre, cantidad: num(d.cantidad), documento: 'Entrada ' + e.numRemision });
            }));
            (D.salidasAlmacen || []).forEach(e => (e.materialDetalles || []).forEach(d => {
                if (d.productoGuid === 'MAT-01') movimientos.push({ fecha: e.fecha, tipo: 'Salida', almacen: (MAPS.almacen[e.almacenGuid] || {}).nombre, cantidad: -num(d.cantidad), documento: e.documento });
            }));
            (D.traspasosAlmacen || []).forEach(e => (e.materialDetalles || []).forEach(d => {
                if (d.productoGuid === 'MAT-01') {
                    movimientos.push({ fecha: e.fecha, tipo: 'Traspaso (salida)', almacen: (MAPS.almacen[e.almacenOrigenGuid] || {}).nombre, cantidad: -num(d.cantidad), documento: e.documento });
                    movimientos.push({ fecha: e.fecha, tipo: 'Traspaso (entrada)', almacen: (MAPS.almacen[e.almacenDestinoGuid] || {}).nombre, cantidad: num(d.cantidad), documento: e.documento });
                }
            }));
            movimientos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Cemento disponible total', value: fmtNum(total.cantidad, 2) + ' ton', sub: `${fmtNum(total.cantidad * 1000, 0)} sacos de 50 kg aprox.`, icon: 'layers', tone: total.cantidad < num(mat.stockMinimo) ? 'bad' : 'good' })}
          ${kpiCard({ label: 'Valor del inventario', value: fmtMXN0(total.valor), sub: 'Valorizado al último precio de entrada', icon: 'circle-dollar-sign', tone: 'info' })}
          ${kpiCard({ label: 'Entradas acumuladas', value: fmtNum(entradas, 2) + ' ton', sub: 'Total recibido en almacenes', icon: 'arrow-down-to-line', tone: 'good' })}
          ${kpiCard({ label: 'Salidas acumuladas', value: fmtNum(salidas, 2) + ' ton', sub: 'Total consumido en obra', icon: 'arrow-up-from-line', tone: 'warn' })}
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
          ${chartCard('chCementoAlm', 'Cemento por almacén', 'Toneladas disponibles al corte', 300, 'xl:col-span-2')}
          ${chartCard('chCementoDona', 'Distribución del stock', 'Participación por almacén', 300)}
        </div>

        ${tableCard('Existencia de cemento por almacén',
                [{ t: 'Almacén' }, { t: 'Existencia (ton)', align: 'r' }, { t: 'Valor', align: 'r' }, { t: 'Participación', align: 'r' }],
                stockAlm.map(a => [
                    `<div class="font-semibold text-ink-800">${a.almacen.nombre}</div><div class="text-[10px] text-ink-500">${a.almacen.codigo || ''}</div>`,
                    fmtNum(a.cantidad, 2), fmtMXN0(a.valor),
                    `<span class="font-semibold text-ink-700">${fmtPct(total.cantidad ? a.cantidad / total.cantidad * 100 : 0)}</span>`
                ]), { maxH: 220 })}

        ${sectionTitle('Kardex de movimientos', 'Últimos movimientos registrados del insumo')}
        ${tableCard('Movimientos de cemento',
                    [{ t: 'Fecha' }, { t: 'Tipo' }, { t: 'Almacén' }, { t: 'Documento' }, { t: 'Cantidad (ton)', align: 'r' }],
                    movimientos.slice(0, 20).map(m => [
                        `<span class="text-[10.5px] text-ink-600">${fmtDate(m.fecha)}</span>`,
                        `<span class="text-[10.5px] font-semibold ${m.tipo.startsWith('Entrada') || m.tipo.includes('entrada') ? 'text-emerald-600' : 'text-amber-600'}">${m.tipo}</span>`,
                        `<span class="text-[10.5px] text-ink-600">${m.almacen || '—'}</span>`,
                        `<span class="text-[10.5px] text-ink-500">${m.documento}</span>`,
                        `<span class="${m.cantidad >= 0 ? 'text-emerald-600' : 'text-red-600'} font-bold">${m.cantidad >= 0 ? '+' : ''}${fmtNum(m.cantidad, 2)}</span>`
                    ]), { maxH: 360 })}

        ${insightPanel([
                        { tone: total.cantidad < num(mat.stockMinimo) ? 'critical' : 'good', titulo: 'Nivel de inventario de cemento', detalle: `Existen ${fmtNum(total.cantidad, 2)} toneladas de cemento en los almacenes, ${total.cantidad < num(mat.stockMinimo) ? 'por debajo' : 'por encima'} del stock mínimo definido de ${fmtNum(mat.stockMinimo, 0)} ton.` },
                        { tone: 'info', titulo: 'Consumo proyectado', detalle: `Con el ritmo de consumo actual (${fmtNum(salidas / Math.max(1, daysBetween(D.generales.fechaInicia, TODAY)) * 30, 2)} ton/mes), el inventario actual cubre aproximadamente ${(total.cantidad / Math.max(0.01, (salidas / Math.max(1, daysBetween(D.generales.fechaInicia, TODAY)) * 30)) * 30).toFixed(0)} días.` }
                    ])}
      </div>`;

            const charts = [
                {
                    id: 'chCementoAlm', config: {
                        type: 'bar',
                        data: {
                            labels: stockAlm.map(a => a.almacen.nombre.replace('Almacén ', '')),
                            datasets: [{ label: 'Toneladas', data: stockAlm.map(a => +a.cantidad.toFixed(2)), backgroundColor: '#1c63ef', borderRadius: 6, barPercentage: .5 }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y.toFixed(2) + ' ton' } } },
                            scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#eef2f7' } }, x: { grid: { display: false }, ticks: { font: { size: 10.5 } } } }
                        }
                    }
                },
                {
                    id: 'chCementoDona', config: {
                        type: 'doughnut',
                        data: {
                            labels: stockAlm.map(a => a.almacen.nombre.replace('Almacén ', '')),
                            datasets: [{ data: stockAlm.map(a => +a.cantidad.toFixed(2)), backgroundColor: ['#1c63ef', '#10b981', '#f59e0b', '#8b5cf6'], borderWidth: 0, hoverOffset: 5 }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false, cutout: '62%',
                            plugins: {
                                legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 10 } } },

                            }
                        }
                    }
                }];
            return { html, charts };
        };

        /* ---------- 15. PROVEEDOR RETRASADO ---------- */
        VIEWS['proveedor-retrasado'] = () => {
            const data = retrasosProveedor();
            const peor = data[0];

            (D.entradasAlmacen || []).forEach(en => {
                const oc = MAPS.ordenCompra[en.ordenCompraGuid];
                if (!oc) return;
                const prov = MAPS.contratista[oc.proveedorGuid];
                if (!prov) return;
                detalleEntregas.push({
                    proveedor: prov, oc, entrada: en,
                    dias: Math.max(0, daysBetween(oc.fecha, en.fecha))
                });
            });

      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Proveedor más tardío', value: peor ? peor.proveedor.nombre.split(' ').slice(0, 2).join(' ') : '—', sub: peor ? `Promedio de ${peor.promedio.toFixed(1)} días entre OC y entrega` : 'Sin datos', icon: 'clock-alert', tone: 'bad' })}
          ${kpiCard({ label: 'Días promedio de entrega', value: data.length ? (data.reduce((s, x) => s + x.totalDias, 0) / data.reduce((s, x) => s + x.n, 0)).toFixed(1) + ' días' : '—', sub: 'De todos los proveedores con entrega', icon: 'timer', tone: 'warn' })}
          ${kpiCard({ label: 'Máximo retraso registrado', value: data.length ? Math.max(...data.map(x => x.maxDias)) + ' días' : '—', sub: 'Peor desempeño individual', icon: 'alarm-clock', tone: 'bad' })}
          ${kpiCard({ label: 'Proveedores evaluados', value: fmtNum(data.length), sub: 'Con al menos una entrega registrada', icon: 'truck', tone: 'info' })}
        </div>

        ${chartCard('chProv', 'Días promedio entre orden de compra y entrada a almacén', 'Ranking de proveedores por tiempo de entrega', 320)}

        ${tableCard('Desempeño de entrega por proveedor',
                [{ t: 'Proveedor' }, { t: 'Entregas', align: 'r' }, { t: 'Días promedio', align: 'r' }, { t: 'Máx. retraso', align: 'r' }, { t: 'Desempeño' }],
                data.map(x => [
                    `<div class="font-semibold text-ink-800">${x.proveedor.nombre}</div><div class="text-[10px] text-ink-500">${x.proveedor.especialidad || ''}</div>`,
                    fmtNum(x.n), fmtNum(x.promedio, 1) + ' días', fmtNum(x.maxDias) + ' días',
                    x.promedio > 10 ? chip('Deficiente', 'bad') : x.promedio > 6 ? chip('Regular', 'warn') : chip('Aceptable', 'good')
                ]), { maxH: 280 })}

        ${sectionTitle('Detalle de entregas', 'Comparativo entre fecha de OC y fecha de entrada a almacén')}
        ${tableCard('Bitácora de entregas por orden de compra',
                    [{ t: 'Proveedor' }, { t: 'OC' }, { t: 'Fecha OC' }, { t: 'Fecha entrada' }, { t: 'Días', align: 'r' }, { t: 'Estado' }],
                    detalleEntregas.slice(0, 20).map(x => [
                        `<span class="text-[10.5px] text-ink-700 font-semibold">${x.proveedor.nombre}</span>`,
                        `<span class="text-[10.5px] text-ink-500">OC-${String(x.oc.numeroSecuencia).padStart(3, '0')}</span>`,
                        `<span class="text-[10.5px] text-ink-500">${fmtDateShort(x.oc.fecha)}</span>`,
                        `<span class="text-[10.5px] text-ink-500">${fmtDateShort(x.entrada.fecha)}</span>`,
                        `<span class="${x.dias > 10 ? 'text-red-600 font-bold' : x.dias > 6 ? 'text-amber-600 font-semibold' : 'text-emerald-600 font-semibold'}">${x.dias}</span>`,
                        x.dias > 10 ? chip('Retraso crítico', 'bad') : x.dias > 6 ? chip('Retraso', 'warn') : chip('En tiempo', 'good')
                    ]), { maxH: 360 })}

        ${insightPanel([
                        { tone: 'critical', titulo: 'Proveedor con mayor retraso', detalle: peor ? `${peor.proveedor.nombre} registra un promedio de ${peor.promedio.toFixed(1)} días entre la emisión de la orden de compra y la entrada efectiva al almacén, con un máximo de ${peor.maxDias} días.` : '—' },
                        { tone: 'warn', titulo: 'Acción sugerida', detalle: 'Se recomienda formalizar acuerdos de nivel de servicio (SLA) con penalización por entrega tardía y evaluar proveedores alternos para los insumos críticos.' }

            const charts = [{

                        }]
                    },
                    options: {
                        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.x.toFixed(1) + ' días' } } },
                        scales: { x: { beginAtZero: true, grid: { color: '#eef2f7' }, ticks: { callback: v => v + ' d', font: { size: 10 } } }, y: { grid: { display: false }, ticks: { font: { size: 10.5 } } } }
                    }
                }
            }];
            return { html, charts };
        };

        /* ---------- 16. INVENTARIO ---------- */
        VIEWS['inventario'] = () => {
            const rows = D.materiales.map(m => {
                const st = stockTotal(m.guid);
                const ent = entradasTotales(m.guid);
                let sal = 0;
                (D.salidasAlmacen || []).forEach(s => (s.materialDetalles || []).forEach(d => { if (d.productoGuid === m.guid && d.procesado) sal += num(d.cantidad); }));
                const rot = st.cantidad > 0 ? sal / st.cantidad : (sal > 0 ? sal : 0);
                return { m, stock: st.cantidad, valor: st.valor, entradas: ent, salidas: sal, rotacion: rot };
            }).filter(x => x.entradas > 0 || x.stock > 0)
                .sort((a, b) => b.valor - a.valor);

            const valorTotal = rows.reduce((s, x) => s + x.valor, 0);
            const rotPromedio = rows.filter(x => x.rotacion > 0).reduce((s, x) => s + x.rotacion, 0) / Math.max(1, rows.filter(x => x.rotacion > 0).length);

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Valor total del inventario', value: fmtMXN0(valorTotal), sub: 'Valorizado a último precio de entrada', icon: 'boxes', tone: 'info' })}
          ${kpiCard({ label: 'SKU con existencia', value: fmtNum(rows.filter(x => x.stock > 0).length), sub: `de ${D.materiales.length} materiales del catálogo`, icon: 'package-check', tone: 'info' })}
          ${kpiCard({ label: 'Rotación promedio', value: fmtNum(rotPromedio, 2) + 'x', sub: 'Consumo acumulado / inventario final', icon: 'repeat', tone: rotPromedio < 1 ? 'warn' : 'good' })}
          ${kpiCard({ label: 'Material de mayor valor', value: rows[0] ? rows[0].m.descripcionCorta : '—', sub: rows[0] ? fmtMXN0(rows[0].valor) + ' en inventario' : '—', icon: 'gem', tone: 'info' })}
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
          ${chartCard('chInvVal', 'Valor de inventario por material', 'Top materiales por valor económico', 320, 'xl:col-span-2')}
          ${chartCard('chInvRot', 'Rotación del inventario', 'Veces que se renovó el stock en el periodo', 320)}
        </div>

        ${tableCard('Detalle de inventario y rotación',
                [{ t: 'Material' }, { t: 'Entradas', align: 'r' }, { t: 'Salidas', align: 'r' }, { t: 'Stock final', align: 'r' }, { t: 'Unidad' }, { t: 'Valor', align: 'r' }, { t: 'Rotación', align: 'r' }, { t: 'Estado' }],
                rows.map(x => [
                    `<div class="font-semibold text-ink-800">${x.m.descripcionCorta}</div><div class="text-[10px] text-ink-500">${x.m.codigo}</div>`,
                    fmtNum(x.entradas, 2), fmtNum(x.salidas, 2),
                    `<span class="font-semibold ${x.stock <= 0 ? 'text-red-600' : 'text-ink-800'}">${fmtNum(x.stock, 2)}</span>`,
                    `<span class="text-[10.5px] text-ink-500">${x.m.unidad}</span>`,
                    `<span class="font-semibold text-ink-800">${fmtMXN0(x.valor)}</span>`,
                    `<span class="font-semibold ${x.rotacion > 1 ? 'text-emerald-600' : 'text-amber-600'}">${fmtNum(x.rotacion, 2)}x</span>`,
                    x.stock <= 0 ? chip('Sin existencia', 'bad') : (x.stock < num(x.m.stockMinimo) ? chip('Bajo mínimo', 'warn') : chip('Normal', 'good'))
                ]), { maxH: 440 })}

        ${insightPanel([
                    { tone: 'info', titulo: 'Composición del inventario', detalle: `El inventario total valorizado asciende a ${fmtMXN0(valorTotal)}, concentrado principalmente en ${rows.slice(0, 3).map(x => x.m.descripcionCorta).join(', ')}.` },
                    { tone: rotPromedio < 1 ? 'warn' : 'good', titulo: 'Eficiencia de rotación', detalle: `La rotación promedio del inventario es de ${fmtNum(rotPromedio, 2)}x, indicando ${rotPromedio < 1 ? 'una acumulación de material por encima del consumo real' : 'un flujo adecuado de materiales'}.` }
                ])}
      </div>`;

            const charts = [
                {
                    id: 'chInvVal', config: {
                        type: 'bar',
                        data: {
                            labels: rows.slice(0, 10).map(x => x.m.descripcionCorta),
                            datasets: [{ label: 'Valor', data: rows.slice(0, 10).map(x => +x.valor.toFixed(2)), backgroundColor: '#1c63ef', borderRadius: 6, barPercentage: .6 }]
                        },
                        options: {
                            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmtMXN0(c.parsed.x) } } },
                            scales: { x: { beginAtZero: true, grid: { color: '#eef2f7' }, ticks: { callback: v => '$' + (v / 1000).toFixed(0) + 'k', font: { size: 10 } } }, y: { grid: { display: false }, ticks: { font: { size: 10 } } } }
                        }
                    }
                },
                {
                    id: 'chInvRot', config: {
                        type: 'bar',
                        data: {
                            labels: rows.filter(x => x.rotacion > 0).slice(0, 10).map(x => x.m.descripcionCorta),
                            datasets: [{
                                label: 'Rotación', data: rows.filter(x => x.rotacion > 0).slice(0, 10).map(x => +x.rotacion.toFixed(2)),
                                backgroundColor: '#10b981', borderRadius: 6, barPercentage: .6
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y.toFixed(2) + 'x' } } },
                            scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#eef2f7' } }, x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 40 } } }
                        }
                    }
                }];
            return { html, charts };
        };

        /* ---------- 17. CONTRATOS POR VENCER ---------- */
        VIEWS['contratos-vencer'] = () => {
            const limite = new Date(TODAY.getTime() + 15 * 86400000);
            const porVencer = (D.contratos || []).filter(c => {
                const f = new Date(c.fechaTermino);
                return f >= TODAY && f <= limite;
            }).sort((a, b) => new Date(a.fechaTermino) - new Date(b.fechaTermino));

            const vencidos = (D.contratos || []).filter(c => new Date(c.fechaTermino) < TODAY);

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Contratos por vencer', value: fmtNum(porVencer.length), sub: 'En los próximos 15 días naturales', icon: 'calendar-x', tone: porVencer.length ? 'bad' : 'good' })}
          ${kpiCard({ label: 'Valor involucrado', value: fmtMXN0(porVencer.reduce((s, c) => s + num(c.importe), 0)), sub: 'Importe contractual de los contratos', icon: 'circle-dollar-sign', tone: 'warn' })}
          ${kpiCard({ label: 'Anticipos por regularizar', value: fmtMXN0(porVencer.reduce((s, c) => s + num(c.anticipo), 0)), sub: 'Anticipo otorgado en esos contratos', icon: 'hand-coins', tone: 'warn' })}
          ${kpiCard({ label: 'Contratos vencidos', value: fmtNum(vencidos.length), sub: 'Con fecha de término anterior al corte', icon: 'alert-octagon', tone: vencidos.length ? 'bad' : 'good' })}
        </div>

        ${tableCard('Contratos por vencer en los próximos 15 días',
                [{ t: 'Contrato' }, { t: 'Contratista' }, { t: 'Descripción' }, { t: 'Inicio' }, { t: 'Término' }, { t: 'Días restantes', align: 'r' }, { t: 'Importe', align: 'r' }, { t: 'Avance', align: 'r' }],
                porVencer.map(c => {
                    const ct = MAPS.contratista[c.contratistaGuid];
                    const ps = PARTIDAS.filter(p => p.contratoGuid === c.guid);
                    const ic = ps.reduce((s, p) => s + p.importeContratado, 0);
                    const ir = ps.reduce((s, p) => s + p.importeReal, 0);
                    const av = ic ? ir / ic : 0;
                    const dias = daysBetween(TODAY, c.fechaTermino);
                    return [
                        `<div class="font-semibold text-ink-800">${c.numeroContrato}</div>`,
                        `<span class="text-[10.5px] text-ink-600">${ct ? ct.nombre : '—'}</span>`,
                        `<span class="text-[10.5px] text-ink-500">${c.descripcion.substring(0, 55)}${c.descripcion.length > 55 ? '…' : ''}</span>`,
                        `<span class="text-[10.5px] text-ink-500">${fmtDateShort(c.fechaInicio)}</span>`,
                        `<span class="text-[10.5px] font-semibold text-ink-800">${fmtDateShort(c.fechaTermino)}</span>`,
                        `<span class="${dias <= 7 ? 'text-red-600 font-bold' : 'text-amber-600 font-semibold'}">${dias}</span>`,
                        fmtMXN0(c.importe),
                        `<span class="${av < 0.9 ? 'text-red-600' : 'text-emerald-600'} font-bold">${fmtPct(av * 100)}</span>`
                    ];
                }), { maxH: 340 })}

        ${insightPanel([
                    { tone: 'critical', titulo: 'Contratos con vencimiento inminente', detalle: porVencer.length ? `${porVencer.map(c => c.numeroContrato + ' (' + fmtDateShort(c.fechaTermino) + ')').join(', ')} requieren revisión de convenio modificatorio o cierre formal.` : 'No hay contratos con vencimiento en los próximos 15 días.' },
                    { tone: 'warn', titulo: 'Validación de entregables', detalle: 'Verificar actas de fin de obra, liberación de fondo de garantía y amortización total de anticipos antes del cierre contractual.' }
                ])}
      </div>`;
            return { html, charts: [] };
        };

        /* ---------- 18. ANTICIPO POR AMORTIZAR ---------- */
        VIEWS['anticipo-pendiente'] = () => {
            const data = estadoAnticipos().sort((a, b) => b.saldo - a.saldo);
            const totalSaldo = data.reduce((s, x) => s + x.saldo, 0);

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Saldo total por amortizar', value: fmtMXN0(totalSaldo), sub: 'Anticipo pendiente de recuperar', icon: 'hand-coins', tone: 'warn' })}
          ${kpiCard({ label: 'Contratista con mayor saldo', value: data[0] ? data[0].contratista.nombre.split(' ').slice(0, 2).join(' ') : '—', sub: data[0] ? fmtMXN0(data[0].saldo) + ' pendientes' : '—', icon: 'user-round-x', tone: 'bad' })}
          ${kpiCard({ label: 'Anticipos totalmente amortizados', value: fmtNum(data.filter(x => x.saldo <= 0.01).length), sub: `de ${data.length} contratos con anticipo`, icon: 'check-circle-2', tone: 'good' })}
          ${kpiCard({ label: '% global amortizado', value: fmtPct(data.reduce((s, x) => s + x.amortizado, 0) / Math.max(1, data.reduce((s, x) => s + x.anticipoOtorgado, 0)) * 100), sub: 'Avance de recuperación de anticipos', icon: 'percent', tone: 'info' })}
        </div>

        ${chartCard('chAntPend', 'Anticipo por amortizar por contratista', 'Saldo pendiente y porcentaje de avance', 340)}

        ${tableCard('Detalle de anticipo por amortizar por contratista',
                [{ t: 'Contrato' }, { t: 'Contratista' }, { t: 'Anticipo otorgado', align: 'r' }, { t: 'Amortizado', align: 'r' }, { t: 'Saldo pendiente', align: 'r' }, { t: '% Amortizado', align: 'r' }, { t: 'Estimaciones', align: 'r' }],
                data.map(x => {
                    const nEst = ESTIMACIONES.filter(e => e.contratoGuid === x.contrato.guid).length;
                    return [
                        `<div class="font-semibold text-ink-800">${x.contrato.numeroContrato}</div>`,
                        `<span class="text-[10.5px] text-ink-600">${x.contratista.nombre}</span>`,
                        fmtMXN0(x.anticipoOtorgado), fmtMXN0(x.amortizado),
                        `<span class="${x.saldo > 0 ? 'text-red-600 font-bold' : 'text-emerald-600'}">${fmtMXN0(x.saldo)}</span>`,
                        `<div class="flex items-center gap-2 justify-end">
                <div class="w-16 h-1.5 rounded-full bg-ink-100 overflow-hidden"><div class="h-full bg-brand-500 rounded-full" style="width:${x.pctAmort * 100}%"></div></div>
                <span class="font-semibold text-ink-800 w-12 text-right">${fmtPct(x.pctAmort * 100)}</span>
              </div>`,
                        fmtNum(nEst)
                    ];
                }), { maxH: 340 })}

        ${insightPanel([
                    { tone: 'warn', titulo: 'Riesgo de recuperación de anticipos', detalle: `Existe un saldo total de ${fmtMXN0(totalSaldo)} por amortizar. El contratista con mayor exposición es ${data[0] ? data[0].contratista.nombre : '—'} con ${data[0] ? fmtMXN0(data[0].saldo) : '—'}.` }
                ])}
      </div>`;

            const charts = [{
                id: 'chAntPend', config: {
                    type: 'bar',
                    data: {
                        labels: data.map(x => x.contrato.numeroContrato),
                        datasets: [
                            { label: 'Amortizado', data: data.map(x => +x.amortizado.toFixed(2)), backgroundColor: '#1c63ef', borderRadius: 5, stack: 'a' },
                            { label: 'Saldo pendiente', data: data.map(x => +x.saldo.toFixed(2)), backgroundColor: '#f59e0b', borderRadius: 5, stack: 'a' }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 11 } } },
                            tooltip: { callbacks: { label: c => c.dataset.label + ': ' + fmtMXN0(c.parsed.y) } }
                        },
                        scales: {
                            x: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 } } },
                            y: { stacked: true, beginAtZero: true, ticks: { callback: v => '$' + (v / 1e6).toFixed(1) + 'M', font: { size: 10 } }, grid: { color: '#eef2f7' } }
                        }
                    }
                }
            }];
            return { html, charts };
        };

        /* ---------- 19. CLIENTES POR COBRAR ---------- */
        VIEWS['clientes-cobro'] = () => {
            const porCliente = {};
            CONTRARECIBOS.forEach(cr => {
                const k = cr.clienteGuid;
                if (!porCliente[k]) porCliente[k] = { cliente: MAPS.cliente[k] || { nombre: '—' }, facturado: 0, cobrado: 0, saldo: 0, n: 0, vencidos: 0 };
                porCliente[k].facturado += num(cr.facturaRelacionadaImporte);
                porCliente[k].cobrado += cr.pagado;
                porCliente[k].saldo += Math.max(0, cr.saldo);
                porCliente[k].n++;
                if (cr.saldo > 0 && new Date(cr.fechaVencimiento) < TODAY) porCliente[k].vencidos++;
            });
            const arr = Object.values(porCliente).sort((a, b) => b.saldo - a.saldo);
            const totalSaldo = arr.reduce((s, x) => s + x.saldo, 0);
            const totalVencido = CONTRARECIBOS.filter(cr => cr.saldo > 0 && new Date(cr.fechaVencimiento) < TODAY)
                .reduce((s, cr) => s + cr.saldo, 0);

            const html = `
      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${kpiCard({ label: 'Cartera total por cobrar', value: fmtMXN0(totalSaldo), sub: 'Saldo pendiente de contrarecibos', icon: 'hourglass', tone: 'warn' })}
          ${kpiCard({ label: 'Saldo vencido', value: fmtMXN0(totalVencido), sub: 'Contrarecibos con vencimiento superado', icon: 'alert-octagon', tone: totalVencido > 0 ? 'bad' : 'good' })}
          ${kpiCard({ label: 'Clientes con saldo', value: fmtNum(arr.filter(x => x.saldo > 0).length), sub: `de ${arr.length} clientes registrados`, icon: 'users', tone: 'info' })}
          ${kpiCard({ label: '% de cobro', value: fmtPct((CONTRARECIBOS.reduce((s, c) => s + c.pagado, 0) / Math.max(1, CONTRARECIBOS.reduce((s, c) => s + num(c.facturaRelacionadaImporte), 0))) * 100), sub: 'Sobre el total facturado a clientes', icon: 'percent', tone: 'info' })}
        </div>

        ${chartCard('chCobrar', 'Facturado vs cobrado por cliente', 'Importe de contrarecibos emitidos', 320)}

        ${tableCard('Clientes con estimaciones pendientes de cobro',
                [{ t: 'Cliente' }, { t: 'Contrarecibos', align: 'r' }, { t: 'Facturado', align: 'r' }, { t: 'Cobrado', align: 'r' }, { t: 'Saldo', align: 'r' }, { t: 'Vencidos', align: 'r' }, { t: 'Estado' }],
                arr.filter(x => x.saldo > 0).map(x => [
                    `<div class="font-semibold text-ink-800">${x.cliente.nombre}</div><div class="text-[10px] text-ink-500">${x.cliente.codigo || ''} · ${x.cliente.rfc || ''}</div>`,
                    fmtNum(x.n), fmtMXN0(x.facturado), fmtMXN0(x.cobrado),
                    `<span class="text-red-600 font-bold">${fmtMXN0(x.saldo)}</span>`,
                    `<span class="${x.vencidos > 0 ? 'text-red-600 font-bold' : 'text-ink-500'}">${x.vencidos}</span>`,
                    x.vencidos > 0 ? chip('Cartera vencida', 'bad') : chip('En plazo', 'warn')
                ]), { maxH: 300 })}

        ${insightPanel([
                    { tone: totalVencido > 0 ? 'critical' : 'info', titulo: 'Estado de la cartera', detalle: `La cartera por cobrar asciende a ${fmtMXN0(totalSaldo)}, de los cuales ${fmtMXN0(totalVencido)} se encuentran vencidos y requieren gestión de cobranza inmediata.` }
                ])}
      </div>`;

                id: 'chCobrar', config: {
                    type: 'bar',
                    data: {
